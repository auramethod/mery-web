backend:
  name: git-gateway
  branch: main

locale: es
media_folder: "images"
public_folder: "images"
logo_url: /images/mery-logo.png
site_url: https://www.meryrestaurante.com

collections:
  - name: carta
    label: "Carta"
    files:
      - name: carta
        label: "Carta del restaurante"
        file: "content/carta.json"
        fields:
          - label: "Categorías"
            name: categorias
            widget: list
            summary: "{{fields.nombre_es}}"
            fields:
              - {label: "ID (sin espacios, no cambiar)", name: id, widget: string}
              - {label: "Nombre (Español)", name: nombre_es, widget: string}
              - {label: "Nom (Català)", name: nombre_ca, widget: string}
              - {label: "Name (English)", name: nombre_en, widget: string}
              - label: "Platos"
                name: platos
                widget: list
                summary: "{{fields.nombre}} · {{fields.precio}}"
                fields:
                  - {label: "Es un subtítulo (p. ej. Tintos, Blancos)", name: subtitulo, widget: boolean, default: false}
                  - {label: "Nombre", name: nombre, widget: string}
                  - {label: "Descripción", name: descripcion, widget: string, required: false}
                  - {label: "Precio (ej. 16,50 €)", name: precio, widget: string, required: false}

  - name: grupos
    label: "Menús de grupo"
    files:
      - name: grupos
        label: "Menús de grupo"
        file: "content/grupos.json"
        fields:
          - label: "Menús"
            name: menus
            widget: list
            summary: "{{fields.name}} · {{fields.price}}"
            fields:
              - {label: "Nombre del menú", name: name, widget: string}
              - {label: "Precio", name: price, widget: string}
              - {label: "Texto bajo el precio", name: pp, widget: string, default: "por persona"}
              - {label: "Etiqueta (opcional)", name: tag, widget: string, required: false}
              - label: "Apartados"
                name: groups
                widget: list
                summary: "{{fields.label}}"
                fields:
                  - {label: "Título del apartado", name: label, widget: string}
                  - {label: "Platos / bebidas", name: items, widget: list, field: {label: "Elemento", name: item, widget: string}}

  - name: fotos
    label: "Fotos"
    files:
      - name: fotos
        label: "Fotos de la portada e Instagram"
        file: "content/fotos.json"
        fields:
          - label: "Portada (carrusel)"
            name: hero
            widget: list
            fields:
              - {label: "Foto", name: imagen, widget: image}
              - {label: "Descripción de la foto", name: alt, widget: string}
          - label: "Cuadrícula de Instagram (9 fotos)"
            name: instagram
            widget: list
            fields:
              - {label: "Foto", name: imagen, widget: image}
              - {label: "Descripción de la foto", name: alt, widget: string}

  - name: textos
    label: "Textos e idiomas"
    files:
      - name: textos
        label: "Textos de la web (ESP · CAT · EN)"
        file: "content/textos.json"
        fields:
          - {label: "Menú superior · Carta", name: "nav_carta", widget: object, collapsed: true, fields: [{label: "Español", name: es, widget: string}, {label: "Català", name: ca, widget: string}, {label: "English", name: en, widget: string}]}
          - {label: "Menú superior · Eventos", name: "nav_eventos", widget: object, collapsed: true, fields: [{label: "Español", name: es, widget: string}, {label: "Català", name: ca, widget: string}, {label: "English", name: en, widget: string}]}
          - {label: "Menú superior · Opiniones", name: "nav_opiniones", widget: object, collapsed: true, fields: [{label: "Español", name: es, widget: string}, {label: "Català", name: ca, widget: string}, {label: "English", name: en, widget: string}]}
          - {label: "Menú superior · Contacto", name: "nav_contacto", widget: object, collapsed: true, fields: [{label: "Español", name: es, widget: string}, {label: "Català", name: ca, widget: string}, {label: "English", name: en, widget: string}]}
          - {label: "Menú superior · Reservar", name: "nav_reservar", widget: object, collapsed: true, fields: [{label: "Español", name: es, widget: string}, {label: "Català", name: ca, widget: string}, {label: "English", name: en, widget: string}]}
